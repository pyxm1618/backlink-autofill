name: Plugin CI

on:
  push:
    branches: ['feat/codex-plugin', 'main']
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BACKLINK_ALLOW_LOCAL_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal lifecycle repair to PR head
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/20260915-browser-result-lifecycle'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('plugins/backlink-autofill/scripts/browser_runtime.py')
          text = path.read_text(encoding='utf-8')
          if 'def _observe_after_result_sensitive_action(' in text:
              print('minimal browser lifecycle repair already applied')
              raise SystemExit(0)

          replacements = [
              (
                  'import re\nfrom pathlib import Path\n',
                  'import re\nimport time\nfrom pathlib import Path\n',
              ),
              (
                  'AI_WORKER_WINDOW_NAME = "backlink-autofill:ai-worker:v1"\n\n',
                  'AI_WORKER_WINDOW_NAME = "backlink-autofill:ai-worker:v1"\nPOST_ACTION_OBSERVE_MS = 3_000\nPOST_ACTION_POLL_MS = 200\n\n',
              ),
              (
                  '            "complete the captcha",\n            "solve the captcha",\n',
                  '            "complete the captcha",\n            "solve the captcha",\n            "recaptcha incorrect",\n            "captcha incorrect",\n            "captcha verification failed",\n',
              ),
              (
                  '        self._last_blocker: dict[str, str] | None = None\n        self._playwright: Playwright | None = None\n',
                  '        self._last_blocker: dict[str, str] | None = None\n        self._requires_business_confirmation: bool = False\n        self._post_action_observation: dict[str, Any] | None = None\n        self._playwright: Playwright | None = None\n',
              ),
              (
                  '                    self.keep_tab\n                    or bool(self.resume_target_id)\n                    or (self.keep_on_human_blocker and self._stopped_for_human)\n',
                  '                    self.keep_tab\n                    or bool(self.resume_target_id)\n                    or self._requires_business_confirmation\n                    or (self.keep_on_human_blocker and self._stopped_for_human)\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected runtime fragment missing: {old!r}')
              text = text.replace(old, new, 1)

          snapshot_anchor = '\n\nclass BrowserRuntime:\n'
          if snapshot_anchor not in text:
              raise SystemExit('snapshot/class anchor not found')
          signature_helper = '''

          def _snapshot_signature(snapshot: dict[str, Any]) -> tuple[str, str, str]:
              return (
                  str(snapshot.get("url") or ""),
                  str(snapshot.get("title") or ""),
                  str(snapshot.get("body_excerpt") or ""),
              )
          '''
          text = text.replace(snapshot_anchor, textwrap.dedent(signature_helper) + '\n\nclass BrowserRuntime:\n', 1)

          helper_anchor = '\n    def execute(self, url: str, actions: list[dict[str, Any]]) -> dict[str, Any]:\n'
          if helper_anchor not in text:
              raise SystemExit('execute anchor not found')
          helpers = '''

              def _observe_after_result_sensitive_action(self, initial_snapshot: dict[str, Any]) -> tuple[dict[str, Any], dict[str, Any]]:
                  assert self.page is not None
                  started = time.monotonic()
                  last_snapshot = initial_snapshot
                  last_signature = _snapshot_signature(initial_snapshot)
                  changed = False

                  while True:
                      elapsed_ms = int((time.monotonic() - started) * 1000)
                      remaining_ms = POST_ACTION_OBSERVE_MS - elapsed_ms
                      if remaining_ms <= 0:
                          break
                      self.page.wait_for_timeout(min(POST_ACTION_POLL_MS, remaining_ms))
                      try:
                          current = snapshot_page(self.page)
                      except Exception:
                          continue

                      current_signature = _snapshot_signature(current)
                      if current_signature != last_signature:
                          changed = True
                          last_snapshot = current
                          last_signature = current_signature

                      if current.get("human_blocker"):
                          self._stopped_for_human = True
                          self._last_blocker = current.get("human_blocker")
                          last_snapshot = current
                          break

                  waited_ms = int((time.monotonic() - started) * 1000)
                  return last_snapshot, {
                      "waited_ms": waited_ms,
                      "max_wait_ms": POST_ACTION_OBSERVE_MS,
                      "poll_ms": POST_ACTION_POLL_MS,
                      "page_changed": changed,
                      "business_terminal_inferred": False,
                  }

              def _execute_result(
                  self,
                  evidence: list[dict[str, Any]],
                  page: dict[str, Any],
                  stopped_for_human: bool,
              ) -> dict[str, Any]:
                  requires_confirmation = self._requires_business_confirmation
                  recovery = None
                  if requires_confirmation:
                      recovery = {
                          "target_id": self.target_id,
                          "current_url": page.get("url"),
                          "action": "resume_or_confirm_before_cleanup",
                      }
                  return {
                      "ok": True,
                      "actions": evidence,
                      "page": page,
                      "stopped_for_human": stopped_for_human,
                      "target_id": self.target_id,
                      "is_external_cdp": self.is_external_cdp,
                      "requires_business_confirmation": requires_confirmation,
                      "business_result": "unconfirmed" if requires_confirmation else None,
                      "post_action_observation": self._post_action_observation,
                      "recovery": recovery,
                  }
          '''
          text = text.replace(helper_anchor, textwrap.dedent(helpers) + helper_anchor, 1)

          execute_start = text.index('    def execute(self, url: str, actions: list[dict[str, Any]]) -> dict[str, Any]:')
          execute_end = text.index('\n    def resolve_email_otp(', execute_start)
          execute_impl = '''
              def execute(self, url: str, actions: list[dict[str, Any]]) -> dict[str, Any]:
                  if not isinstance(actions, list):
                      raise BrowserRuntimeError("INVALID_ACTIONS", "Actions must be a JSON array")
                  if len(actions) > MAX_ACTIONS:
                      raise BrowserRuntimeError("TOO_MANY_ACTIONS", f"At most {MAX_ACTIONS} browser actions are allowed per plan")

                  initial_page = self.navigate(url)
                  assert self.page is not None
                  evidence: list[dict[str, Any]] = []

                  if initial_page.get("human_blocker"):
                      self._stopped_for_human = True
                      return self._execute_result(evidence, initial_page, True)

                  for index, action in enumerate(actions):
                      if not isinstance(action, dict):
                          raise BrowserRuntimeError("INVALID_ACTION", f"Action {index} must be an object")
                      action_type = action.get("type")
                      selector = action.get("selector")
                      if action_type not in _ALLOWED_ACTIONS:
                          raise BrowserRuntimeError("INVALID_ACTION", f"Unsupported action type at index {index}")

                      locator = self._unique_locator(selector)
                      current_page: dict[str, Any] | None = None
                      try:
                          if action_type == "fill":
                              self._verify_non_sensitive(locator)
                              value = action.get("value")
                              if not isinstance(value, str):
                                  raise BrowserRuntimeError("INVALID_ACTION", f"Fill action {index} requires a string value")
                              locator.fill(value)
                              readback = locator.input_value()
                              if readback != value:
                                  raise BrowserRuntimeError("READBACK_MISMATCH", f"Fill read-back mismatch at action {index}")

                          elif action_type == "credential_fill":
                              self._verify_password_target(locator)
                              password = self._site_password_for_action(action)
                              locator.fill(password)
                              if locator.input_value() != password:
                                  raise BrowserRuntimeError("READBACK_MISMATCH", f"Credential fill read-back mismatch at action {index}")
                              readback = {"credential": "site_password", "verified": True}

                          elif action_type == "select":
                              value = action.get("value")
                              if not isinstance(value, str):
                                  raise BrowserRuntimeError("INVALID_ACTION", f"Select action {index} requires a string value")
                              locator.select_option(value=value)
                              readback = locator.input_value()
                              if readback != value:
                                  raise BrowserRuntimeError("READBACK_MISMATCH", f"Select read-back mismatch at action {index}")

                          elif action_type == "check":
                              locator.check()
                              readback = locator.is_checked()
                              if readback is not True:
                                  raise BrowserRuntimeError("READBACK_MISMATCH", f"Checkbox read-back mismatch at action {index}")

                          elif action_type == "upload":
                              path = self._resolve_upload(action.get("path"))
                              locator.set_input_files(str(path))
                              readback = locator.evaluate("el => el.files && el.files.length ? el.files[0].name : ''")
                              if readback != path.name:
                                  raise BrowserRuntimeError("READBACK_MISMATCH", f"Upload read-back mismatch at action {index}")

                          elif action_type in {"click", "submit"}:
                              locator.click()
                              self.page.wait_for_timeout(200)
                              current_page = snapshot_page(self.page)
                              readback = {
                                  "url": current_page.get("url"),
                                  "title": current_page.get("title"),
                              }
                              self._requires_business_confirmation = True
                              self.keep_tab = True
                              current_page, observation = self._observe_after_result_sensitive_action(current_page)
                              observation.update({"action_index": index, "action_type": action_type})
                              self._post_action_observation = observation

                          evidence.append(
                              {
                                  "index": index,
                                  "type": action_type,
                                  "selector": selector,
                                  "status": "verified",
                                  "readback": readback,
                              }
                          )
                      except BrowserRuntimeError:
                          raise
                      except Exception as exc:
                          raise BrowserRuntimeError(
                              "ACTION_FAILED",
                              f"Browser action {index} ({action_type}) failed for selector {selector!r}: {type(exc).__name__}",
                          ) from exc

                      if current_page is None:
                          current_page = snapshot_page(self.page)
                      if current_page.get("human_blocker"):
                          self._stopped_for_human = True
                          self._last_blocker = current_page.get("human_blocker")
                          return self._execute_result(evidence, current_page, True)

                  final_page = snapshot_page(self.page)
                  return self._execute_result(evidence, final_page, False)
          '''
          text = text[:execute_start] + textwrap.dedent(execute_impl).rstrip() + text[execute_end:]
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/backlink-autofill/scripts/browser_runtime.py
          git commit -m "fix(browser): preserve result lifecycle until confirmation"
          git push origin "HEAD:$HEAD_REF"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate plugin structure and hard gates
        run: node scripts/validate-plugin.mjs
      - name: Test execution state and recipe storage
        run: python3 plugins/backlink-autofill/tests/test_execution_state.py -v
      - name: Install browser runtime dependencies
        run: |
          python3 -m pip install -r plugins/backlink-autofill/scripts/requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Test headless browser runtime
        run: python3 plugins/backlink-autofill/tests/test_browser_runtime.py -v
      - name: Test CDP persistent session
        run: python3 plugins/backlink-autofill/tests/test_cdp_session.py -v
      - name: Test OAuth security and composite EMAIL_OTP
        run: python3 plugins/backlink-autofill/tests/test_oauth_security.py -v
      - name: Test tab isolation and resume protocol
        run: python3 plugins/backlink-autofill/tests/test_tab_isolation.py -v
      - name: Test headed human handoff
        run: xvfb-run -a python3 plugins/backlink-autofill/tests/test_browser_handoff.py -v
      - name: Run full backlink-autofill unit test suite
        run: xvfb-run -a python3 -m unittest discover -s plugins/backlink-autofill/tests -p 'test_*.py' -v
      - name: Test personal installer and shared control plane in isolated HOME
        run: |
          export HOME="$RUNNER_TEMP/test-home"
          mkdir -p "$HOME/.agents/plugins"
          cat > "$HOME/.agents/plugins/marketplace.json" <<'JSON'
          {
            "name": "personal",
            "plugins": [
              {
                "name": "existing-plugin",
                "source": {"source": "local", "path": "./plugins/existing-plugin"},
                "policy": {"installation": "AVAILABLE", "authentication": "ON_USE"},
                "category": "Developer Tools"
              }
            ]
          }
          JSON

          python3 scripts/install-personal.py --repo "$GITHUB_WORKSPACE"
          test -f "$HOME/plugins/backlink-autofill/.codex-plugin/plugin.json"
          test -f "$HOME/.backlink-autofill/submitter-profile.json"
          test -d "$HOME/.backlink-autofill/projects"
          test -d "$HOME/.backlink-autofill/browser-profile"
          test -d "$HOME/.backlink-autofill/runtime"
          test -d "$HOME/.backlink-autofill/recipes"
          test -d "$HOME/.backlink-autofill/credentials"

          python3 scripts/configure-control-plane.py \
            --spreadsheet-id TEST_SHEET_ID \
            --home "$HOME"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          home = Path(os.environ['HOME'])
          root = home / '.backlink-autofill'
          marketplace = json.loads((home / '.agents/plugins/marketplace.json').read_text())
          by_name = {x['name']: x for x in marketplace['plugins']}
          assert 'existing-plugin' in by_name, by_name
          assert 'backlink-autofill' in by_name, by_name
          assert by_name['backlink-autofill']['source']['path'] == './plugins/backlink-autofill'

          profile = root / 'submitter-profile.json'
          payload = json.loads(profile.read_text())
          canonical = {
              'schema_version', 'name', 'registration_email', 'country', 'region', 'city',
              'company', 'job_title', 'phone', 'x_twitter', 'linkedin', 'github',
              'default_username', 'notes'
          }
          assert set(payload) == canonical, payload
          payload['name'] = 'Persistent User'
          payload['registration_email'] = 'persistent@example.com'
          profile.write_text(json.dumps(payload))

          control = root / 'control-plane.json'
          control_payload = json.loads(control.read_text())
          assert control_payload == {
              'schema_version': 1,
              'spreadsheet_id': 'TEST_SHEET_ID',
              'master_sheet': '外链总表',
              'project_sheet': '外链管理',
              'default_batch_size': 100,
          }, control_payload

          project_b = root / 'projects/project-b'
          project_b.mkdir(parents=True)
          (project_b / 'marker.txt').write_text('KEEP')

          credentials = root / 'credentials'
          (credentials / 'example.com.json').write_text('{"keep": true}')
          print('initial installer/control-plane validation passed')
          PY

          python3 scripts/install-personal.py --repo "$GITHUB_WORKSPACE"

          cmp plugins/backlink-autofill/scripts/browser_cli.py "$HOME/plugins/backlink-autofill/scripts/browser_cli.py"
          cmp plugins/backlink-autofill/scripts/browser_runtime.py "$HOME/plugins/backlink-autofill/scripts/browser_runtime.py"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['HOME']) / '.backlink-autofill'
          payload = json.loads((root / 'submitter-profile.json').read_text())
          assert payload['name'] == 'Persistent User', payload
          assert payload['registration_email'] == 'persistent@example.com', payload
          assert (root / 'projects/project-b/marker.txt').read_text() == 'KEEP'
          assert (root / 'credentials/example.com.json').read_text() == '{"keep": true}'
          control_payload = json.loads((root / 'control-plane.json').read_text())
          assert control_payload['spreadsheet_id'] == 'TEST_SHEET_ID', control_payload
          assert control_payload['master_sheet'] == '外链总表', control_payload
          assert control_payload['project_sheet'] == '外链管理', control_payload
          assert control_payload['default_batch_size'] == 100, control_payload
          print('shared profile, control plane, credentials, runtime dirs, sibling project preservation, and installed runtime byte identity passed')
          PY